<body>
  <!-- اتجاه الواجهة يُشتق من اللغة المحفوظة قبل رسم أي شيء — يمنع وميض RTL
       في الواجهات غير العربية. مصدر الحقيقة النهائي هو SettingsContext
       بعد تحميل الإعدادات من الخادم. -->
  <script>
    (function () {
      try {
        var lang = localStorage.getItem("language") || "en";
        var dir = lang === "ar" ? "rtl" : "ltr";
        document.documentElement.setAttribute("lang", lang);
        document.documentElement.setAttribute("dir", dir);
        document.body.setAttribute("dir", dir);
      } catch (e) {}
    })();
  </script>
